name: jimple-threads-ci

# Focused build+test loop for the Jimple thread-support work (public fork: free CI).
# Builds ESBMC with build.sh, then sanity-checks: --version, a known jimple fixture
# (kt-array-false -> FAILED), the C pthread race (-> FAILED, proves the concurrency
# engine), and our jimple thread test once it exists.
on:
  workflow_dispatch:
  push:
    branches: [jimple-threads]
    paths: ['src/jimple-frontend/**', 'src/goto-symex/**', 'jimple-threads-spike/**', '.github/workflows/jimple-threads-ci.yml']

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache LLVM/solver deps
        uses: actions/cache@v4
        with:
          path: |
            .deps
          key: esbmc-deps-${{ runner.os }}-v1

      # ccache caches compiled object files across runs. Since iterations touch
      # only a few jimple-frontend files, warm builds recompile just those +
      # relink, dropping the ~20-min cold build to a few minutes.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: esbmc-jimple-${{ runner.os }}
          max-size: 2G

      # Phase 1: configure deps (downloads LLVM/solvers, creates build/).
      - name: Configure (deps)
        run: ./scripts/build.sh deps

      # Phase 2: reconfigure for speed — route compiles through ccache and drop
      # frontends/solvers this spike doesn't need (we only use Jimple + Z3).
      - name: Trim build (ccache + minimal frontends/solvers)
        run: |
          cmake build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_PYTHON_FRONTEND=Off \
            -DENABLE_SOLIDITY_FRONTEND=Off \
            -DENABLE_BOOLECTOR=Off \
            -DENABLE_BITWUZLA=Off \
            -DENABLE_CVC5=Off \
            -DENABLE_CSMITH=Off \
            -DBUILD_TESTING=Off \
            -DENABLE_REGRESSION=Off

      # Phase 3: compile + install (cmake --build / --install, via build.sh).
      - name: Build + install ESBMC
        run: ./scripts/build.sh build install

      - name: Locate esbmc binary
        id: bin
        run: |
          ESBMC=$(find "$PWD/release" -name esbmc -type f | head -1)
          echo "esbmc=$ESBMC" >> "$GITHUB_OUTPUT"
          "$ESBMC" --version

      - name: Sanity — jimple fixture (expect VERIFICATION FAILED)
        run: |
          "${{ steps.bin.outputs.esbmc }}" regression/jimple/kt-array-false/main.jimple --force-malloc-success | tail -3

      - name: Sanity — C pthread race (expect VERIFICATION FAILED, engine concurrency)
        run: |
          "${{ steps.bin.outputs.esbmc }}" jimple-threads-spike/race.c --context-bound 2 | tail -3

      - name: Jimple thread test (once present)
        run: |
          if [ ! -f jimple-threads-spike/thread.jimple ]; then
            echo "no thread.jimple yet"; exit 0
          fi
          ESBMC="${{ steps.bin.outputs.esbmc }}"
          echo "=== GOTO for the lowered spawn (worker + main) ==="
          "$ESBMC" jimple-threads-spike/thread.jimple --force-malloc-success \
            --goto-functions-only 2>&1 | sed -n '/T:worker/,/^$/p;/T:main/,/^$/p' | head -60 || true
          echo "=== running patched-frontend jimple thread test (full stdout+stderr) ==="
          set +e
          stdbuf -oL -eL "$ESBMC" jimple-threads-spike/thread.jimple \
            --force-malloc-success --context-bound 2 > tj.log 2>&1
          rc=$?
          set -e
          cat tj.log
          echo "=== esbmc exit code: $rc ==="
          if [ "$rc" -ge 128 ]; then
            echo "=== crashed (signal) — capturing gdb backtrace ==="
            sudo apt-get install -y -q gdb >/dev/null 2>&1 || true
            gdb -q -batch -ex 'run' -ex 'bt' --args \
              "$ESBMC" jimple-threads-spike/thread.jimple \
              --force-malloc-success --context-bound 2 2>&1 | tail -40 || true
          fi
