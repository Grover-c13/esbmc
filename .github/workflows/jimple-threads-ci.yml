name: jimple-threads-ci

# Focused build+test loop for the Jimple thread-support work (public fork: free CI).
# Builds ESBMC with build.sh, then sanity-checks: --version, a known jimple fixture
# (kt-array-false -> FAILED), the C pthread race (-> FAILED, proves the concurrency
# engine), and our jimple thread test once it exists.
on:
  workflow_dispatch:
  push:
    branches: [jimple-threads]
    paths: ['src/jimple-frontend/**', 'src/goto-symex/**', 'jimple-threads-spike/**', '.github/workflows/jimple-threads-ci.yml']

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache GMP source tarball
        uses: actions/cache@v4
        with:
          path: |
            .deps
          key: esbmc-deps-${{ runner.os }}-v1

      # The heavy "deps" cost is FetchContent downloading + xz-extracting ~1.5 GB
      # of prebuilt LLVM (+Z3/CVC5) into the ephemeral build/_deps every run.
      # Redirect FetchContent's base dir to this stable, cached location so the
      # download+extract happens once; later runs reuse it (URL-hash stamps make
      # FetchContent skip the work). Keyed on the dependency URLs.
      - name: Cache prebuilt LLVM/solvers (FetchContent)
        uses: actions/cache@v4
        with:
          path: ~/esbmc-fc
          key: esbmc-fc-${{ runner.os }}-${{ hashFiles('scripts/cmake/Options.cmake', 'scripts/cmake/ExternalDependencies.cmake') }}

      # ccache caches compiled object files across runs. Since iterations touch
      # only a few jimple-frontend files, warm builds recompile just those +
      # relink, dropping the ~20-min cold build to a few minutes.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: esbmc-jimple-${{ runner.os }}
          max-size: 2G

      # Phase 1: configure deps. EXTRA_CMAKE_ARGS points FetchContent at the
      # cached dir above (build.sh forwards it to cmake).
      - name: Configure (deps)
        run: |
          export EXTRA_CMAKE_ARGS="-DFETCHCONTENT_BASE_DIR=$HOME/esbmc-fc"
          ./scripts/build.sh deps

      # Phase 2: reconfigure for speed — route compiles through ccache and drop
      # frontends/solvers this spike doesn't need (we only use Jimple + Z3).
      - name: Trim build (ccache + minimal frontends/solvers)
        run: |
          cmake build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_PYTHON_FRONTEND=Off \
            -DENABLE_SOLIDITY_FRONTEND=Off \
            -DENABLE_BOOLECTOR=Off \
            -DENABLE_BITWUZLA=Off \
            -DENABLE_CVC5=Off \
            -DENABLE_CSMITH=Off \
            -DBUILD_TESTING=Off \
            -DENABLE_REGRESSION=Off

      # Phase 3: compile + install (cmake --build / --install, via build.sh).
      - name: Build + install ESBMC
        run: ./scripts/build.sh build install

      - name: Locate esbmc binary
        id: bin
        run: |
          ESBMC=$(find "$PWD/release" -name esbmc -type f | head -1)
          echo "esbmc=$ESBMC" >> "$GITHUB_OUTPUT"
          "$ESBMC" --version

      - name: Sanity — jimple fixture (expect VERIFICATION FAILED)
        run: |
          "${{ steps.bin.outputs.esbmc }}" regression/jimple/kt-array-false/main.jimple --force-malloc-success | tail -3

      - name: Sanity — C pthread race (expect VERIFICATION FAILED, engine concurrency)
        run: |
          "${{ steps.bin.outputs.esbmc }}" jimple-threads-spike/race.c --context-bound 2 | tail -3

      # Regression gates. Each fixture must reach VERIFICATION FAILED with the
      # division-by-zero property; a crash, a SUCCESSFUL verdict, or a different
      # property fails the job. Covers: single-class thread race (thread), the
      # multi-class linker (multiclass: A.main calls B.answer), a real-shape
      # 2-class thread program (mcthread: cross-class static field + instance
      # run() spawned from another class), and javathread — the SAME program
      # emitted by our Soot-based converter from real javac bytecode
      # (Main/Worker.java), proving the producer end-to-end.
      - name: Jimple thread + multi-class gates (expect FAILED, division by zero)
        run: |
          ESBMC="${{ steps.bin.outputs.esbmc }}"
          fail=0
          for f in thread multiclass mcthread javathread runnablethread; do
            jf="jimple-threads-spike/$f.jimple"
            [ -f "$jf" ] || { echo "skip: $jf absent"; continue; }
            echo "==================== $f ===================="
            set +e
            stdbuf -oL -eL "$ESBMC" "$jf" --force-malloc-success --context-bound 2 > tj.log 2>&1
            rc=$?
            set -e
            cat tj.log
            echo "--- $f exit code: $rc ---"
            if [ "$rc" -ge 128 ]; then
              echo "FAIL[$f]: esbmc crashed (signal). gdb backtrace:"
              sudo apt-get install -y -q gdb >/dev/null 2>&1 || true
              gdb -q -batch -ex 'run' -ex 'bt' --args \
                "$ESBMC" "$jf" --force-malloc-success --context-bound 2 2>&1 | tail -40 || true
              fail=1; continue
            fi
            grep -q "VERIFICATION FAILED" tj.log || { echo "FAIL[$f]: expected VERIFICATION FAILED"; fail=1; continue; }
            grep -qi "division by zero" tj.log || { echo "FAIL[$f]: expected division-by-zero property"; fail=1; continue; }
            echo "PASS[$f]"
          done
          exit $fail
